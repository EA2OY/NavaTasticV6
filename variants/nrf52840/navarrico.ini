; =====================================================================
; NAVARICO V6 - ENVS DE PRODUCCION (porte de NavaTastic V5.1 a Meshtastic 2.8.0 oficial)
; =====================================================================
; Cada env conserva la HERENCIA del env de placa original de 2.8 (extends), asi que el binario
; sigue siendo el de la placa y los ajustes de hardware/energia siguen viniendo de 2.8.
;
; QUE APORTA CADA CLAVE (verificado en bin/platformio-custom.py de 2.8: NO existian, se portaron):
;   custom_meshtastic_prefs        -> perfil del env (profiles/*.jsonc): claves, canales, rol, radio
;   custom_meshtastic_app_env      -> APP_ENV canonico que reporta el binario (el nombre de la
;                                     PLACA, no el del env navarrico_*)
;   custom_meshtastic_propia_keys  -> pide las claves del operador por VARIABLES DE ENTORNO
;                                     (NAVARICO_PROPIA_KEY_0/_1, NAVARICO_PROPIA_BT). Si faltan,
;                                     el build ABORTA. Las claves NO se guardan nunca en el repo.
;
; RADIO POR ENV (bloque 1): -DNAVARICO_SOLO_SX126X solo en los envs cuya placa compila 4 familias
; de radio (Promicro/Faketec). El resto de placas ya declaran una sola familia y no lo necesitan.
; El env navarrico_promicro_e22p_full_radio_r2ig compila las 4 a proposito: es la referencia.
;
; NO se declara custom_meshtastic_libdeps_map: su unico fin es la paridad byte a byte, que NO
; aplica entre 2.7.26 y 2.8.0 (confirmado con NavaTastic). El codigo que lo lee esta portado, por
; si algun dia hace falta.
; =====================================================================

; ---------------------------------------------------------------
; PROMICRO (E22P) y FAKETEC (HT-RA62 / SX1262) - COMPARTEN ENV DE PLACA
; Solo estos dos compilan 4 familias de radio -> llevan -DNAVARICO_SOLO_SX126X (bloque 1)
; ---------------------------------------------------------------

[env:navarrico_promicro_e22p_r2ig]
extends = env:nrf52_promicro_diy_tcxo
custom_meshtastic_app_env = nrf52_promicro_diy_tcxo
custom_meshtastic_prefs = profiles/R2IG_Promicro.jsonc
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_E22P
  -DNAVARICO_SOLO_SX126X

[env:navarrico_faketec_sx1262_r2ig]
extends = env:nrf52_promicro_diy_tcxo
custom_meshtastic_app_env = nrf52_promicro_diy_tcxo
custom_meshtastic_prefs = profiles/R2IG_Faketec.jsonc
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_SX1262
  -DNAVARICO_SOLO_SX126X

; ---------------------------------------------------------------
; SEEED SOLAR NODE P1 - SX1262 pelado (22 dBm)
; ---------------------------------------------------------------

[env:navarrico_seed_sx1262_r2ig]
extends = env:seeed_solar_node
custom_meshtastic_app_env = seeed_solar_node
custom_meshtastic_prefs = profiles/R2IG_Seed.jsonc
build_flags = ${env:seeed_solar_node.build_flags}
  -DNAVARICO_RADIO_SX1262

; ---------------------------------------------------------------
; HELTEC T114 - SX1262 pelado (22 dBm). Es la placa con MENOS margen de flash y MAS RAM usada
; ---------------------------------------------------------------

[env:navarrico_t114_sx1262_r2ig]
extends = env:heltec-mesh-node-t114
custom_meshtastic_app_env = heltec-mesh-node-t114
custom_meshtastic_prefs = profiles/R2IG_T114.jsonc
build_flags = ${env:heltec-mesh-node-t114.build_flags}
  -DNAVARICO_RADIO_SX1262
; NAVARICO-V6: la T114 es la UNICA placa que no cabe con el motor /nava dentro (se pasa 1.352 B).
; Se quitan los EMOJIS SOLO AQUI: es la palanca medida mas limpia y es puramente VISUAL (vacia la
; tabla de dibujos y el selector): no toca radio, paquetes, cifrado ni almacenamiento. Los mensajes
; con emoji siguen llegando y guardandose igual; solo dejan de dibujarse como imagen en pantalla.
; Decision del operador (13/09), frente a excluir las balizas de malla (7.000 B), que son funcion
; NUEVA de 2.8 y prefiere conservar. El resto de placas CONSERVAN los emojis.
  -D EXCLUDE_EMOJI

; ---------------------------------------------------------------
; SEEED XIAO nRF52840 KIT i2c - DOS envs porque son DOS modulos distintos pinchados en la MISMA
; placa (sandwich SX1262 -> 22 dBm | modulo E22P -> 8 dBm). NO se unifican.
; ---------------------------------------------------------------

[env:navarrico_xiao_kit_sx1262_r2ig]
extends = env:seeed_xiao_nrf52840_kit_i2c
custom_meshtastic_app_env = seeed_xiao_nrf52840_kit_i2c
custom_meshtastic_prefs = profiles/R2IG_XiaoKitI2c.jsonc
build_flags = ${env:seeed_xiao_nrf52840_kit_i2c.build_flags}
  -DNAVARICO_RADIO_SX1262

[env:navarrico_xiao_e22p_r2ig]
extends = env:seeed_xiao_nrf52840_kit_i2c
custom_meshtastic_app_env = seeed_xiao_nrf52840_kit_i2c
custom_meshtastic_prefs = profiles/R2IG_XiaoKitI2cE22P.jsonc
build_flags = ${env:seeed_xiao_nrf52840_kit_i2c.build_flags}
  -DNAVARICO_RADIO_E22P

; ---------------------------------------------------------------
; RAMA 1 CLIENTES (General) - igual que arriba + marca NAVARICO_RAMA_1 (rol CLIENT)
; ---------------------------------------------------------------

[env:navarrico_promicro_e22p_r1ig]
extends = env:nrf52_promicro_diy_tcxo
custom_meshtastic_app_env = nrf52_promicro_diy_tcxo
custom_meshtastic_prefs = profiles/R1IG_Promicro.jsonc
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_E22P
  -DNAVARICO_SOLO_SX126X
  -DNAVARICO_RAMA_1

[env:navarrico_faketec_sx1262_r1ig]
extends = env:nrf52_promicro_diy_tcxo
custom_meshtastic_app_env = nrf52_promicro_diy_tcxo
custom_meshtastic_prefs = profiles/R1IG_Faketec.jsonc
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_SX1262
  -DNAVARICO_SOLO_SX126X
  -DNAVARICO_RAMA_1

[env:navarrico_seed_sx1262_r1ig]
extends = env:seeed_solar_node
custom_meshtastic_app_env = seeed_solar_node
custom_meshtastic_prefs = profiles/R1IG_Seed.jsonc
build_flags = ${env:seeed_solar_node.build_flags}
  -DNAVARICO_RADIO_SX1262
  -DNAVARICO_RAMA_1

[env:navarrico_t114_sx1262_r1ig]
extends = env:heltec-mesh-node-t114
custom_meshtastic_app_env = heltec-mesh-node-t114
custom_meshtastic_prefs = profiles/R1IG_T114.jsonc
build_flags = ${env:heltec-mesh-node-t114.build_flags}
  -DNAVARICO_RADIO_SX1262
  -DNAVARICO_RAMA_1
; Mismo motivo que en la T114 r2ig: es la unica placa que no cabe con el motor /nava, y los emojis
; se quitan SOLO aqui (palanca medida, puramente visual). El resto de placas los conservan.
  -D EXCLUDE_EMOJI

[env:navarrico_xiao_kit_sx1262_r1ig]
extends = env:seeed_xiao_nrf52840_kit_i2c
custom_meshtastic_app_env = seeed_xiao_nrf52840_kit_i2c
custom_meshtastic_prefs = profiles/R1IG_XiaoKitI2c.jsonc
build_flags = ${env:seeed_xiao_nrf52840_kit_i2c.build_flags}
  -DNAVARICO_RADIO_SX1262
  -DNAVARICO_RAMA_1

[env:navarrico_xiao_e22p_r1ig]
extends = env:seeed_xiao_nrf52840_kit_i2c
custom_meshtastic_app_env = seeed_xiao_nrf52840_kit_i2c
custom_meshtastic_prefs = profiles/R1IG_XiaoKitI2cE22P.jsonc
build_flags = ${env:seeed_xiao_nrf52840_kit_i2c.build_flags}
  -DNAVARICO_RADIO_E22P
  -DNAVARICO_RAMA_1

; ---------------------------------------------------------------
; INFRAESTRUCTURA PROPIA (R2IP/R1IP) - SIN PERFIL EN EL REPO A PROPOSITO:
; extienden del env General equivalente y piden las claves del operador por variables de entorno.
; Si ves un env *_r2ip sin su .jsonc, NO FALTA NADA: es el diseño.
; ---------------------------------------------------------------

[env:navarrico_promicro_e22p_r2ip]
extends = env:navarrico_promicro_e22p_r2ig
custom_meshtastic_propia_keys = true

