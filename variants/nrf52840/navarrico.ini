; ---------------------------------------------------------------
; BANCO (_labaudit / _labaudit2) - FUERA DE LA MALLA REAL
; Extienden del General equivalente y el CODIGO les baja la potencia a 1 dBm y la frecuencia a
; 869.545 (NAVARICO_AUDIT_LAB_869545 / NAVARICO_AUDIT_LAB2). REQUISITO DURO: esa proteccion de
; 1 dBm NO se puede perder al pasar la potencia al perfil. NUNCA se distribuyen.
; ---------------------------------------------------------------

[env:navarrico_faketec_sx1262_r2ig_labaudit]
extends = env:navarrico_faketec_sx1262_r2ig
build_flags = ${env:navarrico_faketec_sx1262_r2ig.build_flags}
  -DNAVARICO_AUDIT_LAB_869545

[env:navarrico_faketec_sx1262_r2ig_labaudit2]
extends = env:navarrico_faketec_sx1262_r2ig
build_flags = ${env:navarrico_faketec_sx1262_r2ig.build_flags}
  -DNAVARICO_AUDIT_LAB2

; ---------------------------------------------------------------
; ENV DE REFERENCIA: 4 FAMILIAS COMPLETAS (Promicro con LR1121/RF95)
; Sin -DNAVARICO_SOLO_SX126X: compila RF95 + LR1121 + LR2021 + SX126x, como la plantilla upstream.
; Sirve de PRUEBA de que la puerta sigue abierta y de referencia de tamano.
; OJO: es la receta con MENOS margen (19,5 KB con emojis). Si algun dia hay que recortar, empezar
; por aqui.
; ---------------------------------------------------------------

[env:navarrico_promicro_e22p_full_radio_r2ig]
extends = env:nrf52_promicro_diy_tcxo
custom_meshtastic_app_env = nrf52_promicro_diy_tcxo
custom_meshtastic_prefs = profiles/R2IG_Promicro.jsonc
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_E22P
