; =====================================================================
; NAVARICO V6 - ENVS DE PRODUCCION (porte de NavaTastic V5.1 a Meshtastic 2.8.0 oficial)
; =====================================================================
; ESTADO: bloque 1 del portaje (radio por env). Cada env conserva la HERENCIA del env de placa
; original de 2.8 (extends), asi que el binario sigue siendo el de la placa y los ajustes de
; hardware/energia siguen viniendo de 2.8, no del fork.
;
; QUE HACE ESTE FICHERO AHORA MISMO:
;   - Declara los 8 envs de produccion de Promicro/Faketec (rama 2 Routers "r2ig" y rama 1
;     Clientes "r1ig"), que son los unicos que compilan 4 familias de radio y por tanto los
;     unicos que ganan flash al compilar solo SX126x.
;   - El flag -DNAVARICO_SOLO_SX126X va AQUI, POR ENV (no en el env de placa), por la regla D20
;     del proyecto: el env de placa lo usan tambien inkhud, easypromicro y CI, y no se le puede
;     quitar LR1121/RF95 a ningun usuario de NavaTastic. Quien tenga esas radios compila sin el
;     flag (ver el env de referencia "_full_radio").
;
; PENDIENTE DE B2 (NO declarado a proposito: en 2.8 no existen y declararlos seria crear claves
; muertas que parecen gobernar algo):
;   - custom_meshtastic_prefs        -> perfiles profiles/*.jsonc (16)
;   - custom_meshtastic_app_env      -> APP_ENV canonico de la placa
;   - custom_meshtastic_libdeps_map  -> -ffile-prefix-map de libdeps
;   - los 12 envs "Propia" (r2ip/r1ip) y los 2 de banco (_labaudit): necesitan el mecanismo de
;     claves por variable de entorno de bin/platformio-custom.py
;   - los 5 envs ESP32 (variants/esp32s3/navarrico_esp32.ini)
; =====================================================================

; ---------------------------------------------------------------
; RAMA 2 ROUTERS (General) - E22P -> Promicro/Xiao E22P | SX1262 -> HT-RA62/Faketec
; ---------------------------------------------------------------

[env:navarrico_promicro_e22p_r2ig]
extends = env:nrf52_promicro_diy_tcxo
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_E22P
  -DNAVARICO_SOLO_SX126X

[env:navarrico_faketec_sx1262_r2ig]
extends = env:nrf52_promicro_diy_tcxo
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_SX1262
  -DNAVARICO_SOLO_SX126X

; ---------------------------------------------------------------
; RAMA 1 CLIENTES (General) - igual que arriba + rol CLIENT (marca NAVARICO_RAMA_1)
; ---------------------------------------------------------------

[env:navarrico_promicro_e22p_r1ig]
extends = env:nrf52_promicro_diy_tcxo
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_E22P
  -DNAVARICO_SOLO_SX126X
  -DNAVARICO_RAMA_1

[env:navarrico_faketec_sx1262_r1ig]
extends = env:nrf52_promicro_diy_tcxo
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_SX1262
  -DNAVARICO_SOLO_SX126X
  -DNAVARICO_RAMA_1

; ---------------------------------------------------------------
; ENV DE REFERENCIA: 4 FAMILIAS COMPLETAS (Promicro con LR1121/RF95)
; Sin -DNAVARICO_SOLO_SX126X: compila RF95 + LR1121 + LR2021 + SX126x, como la plantilla upstream.
; Sirve de PRUEBA de que la puerta sigue abierta y de referencia de tamano para medir el ahorro.
; ---------------------------------------------------------------

[env:navarrico_promicro_e22p_full_radio_r2ig]
extends = env:nrf52_promicro_diy_tcxo
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_E22P
