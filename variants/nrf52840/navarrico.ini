; =====================================================================
; NAVARICO V6 - ENVS DE PRODUCCION (porte de NavaTastic V5.1 a Meshtastic 2.8.0 oficial)
; =====================================================================
; Cada env conserva la HERENCIA del env de placa original de 2.8 (extends), asi que el binario
; sigue siendo el de la placa y los ajustes de hardware/energia siguen viniendo de 2.8.
;
; QUE APORTA CADA CLAVE (verificado en bin/platformio-custom.py de 2.8: NO existian, se portaron):
;   custom_meshtastic_prefs        -> perfil del env (profiles/*.jsonc): claves, canales, rol, radio
;   custom_meshtastic_app_env      -> APP_ENV canonico que reporta el binario (el nombre de la
;                                     PLACA, no el del env navarrico_*)
;   custom_meshtastic_propia_keys  -> pide las claves del operador por VARIABLES DE ENTORNO
;                                     (NAVARICO_PROPIA_KEY_0/_1, NAVARICO_PROPIA_BT). Si faltan,
;                                     el build ABORTA. Las claves NO se guardan nunca en el repo.
;
; RADIO POR ENV (bloque 1): -DNAVARICO_SOLO_SX126X solo en los envs cuya placa compila 4 familias
; de radio (Promicro/Faketec). El resto de placas ya declaran una sola familia y no lo necesitan.
; El env navarrico_promicro_e22p_full_radio_r2ig compila las 4 a proposito: es la referencia.
;
; NO se declara custom_meshtastic_libdeps_map: su unico fin es la paridad byte a byte, que NO
; aplica entre 2.7.26 y 2.8.0 (confirmado con NavaTastic). El codigo que lo lee esta portado, por
; si algun dia hace falta.
; =====================================================================

; ---------------------------------------------------------------
; PROMICRO (E22P) y FAKETEC (HT-RA62 / SX1262) - COMPARTEN ENV DE PLACA
; Solo estos dos compilan 4 familias de radio -> llevan -DNAVARICO_SOLO_SX126X (bloque 1)
; ---------------------------------------------------------------

[env:navarrico_promicro_e22p_r2ig]
extends = env:nrf52_promicro_diy_tcxo
custom_meshtastic_app_env = nrf52_promicro_diy_tcxo
custom_meshtastic_prefs = profiles/R2IG_Promicro.jsonc
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_E22P
  -DNAVARICO_SOLO_SX126X
; NAVARICO-V6 (23/09): con el portaje de V5.3 completo esta placa se pasa del tope de 0xEC000 (812.464 B
; contra 810.496). Se quitan los EMOJIS, igual que en la T114 y por el mismo motivo: es la palanca
; medida mas limpia y es PURAMENTE VISUAL (vacia la tabla de dibujos y el selector): no toca radio,
; paquetes, cifrado ni almacenamiento. Los mensajes con emoji siguen llegando y guardandose igual; solo
; dejan de dibujarse como imagen en pantalla.
; Se probo ANTES a subir el tope del enlazador a 0xED000 aprovechando la pagina del warm-store, y el nodo
; de banco DEJO DE ARRANCAR: 0xEC000-0xED000 NO es territorio libre. Ver el aviso en
; src/platform/nrf52/nrf52840_s140_v6.ld. Los emojis son la via segura.
  -D EXCLUDE_EMOJI
; NAVARICO-V6 (23/09): el motor /nava NO CABE por debajo del tope de fabrica (0xEA000 = 802.816 B):
; se pasa 912 B EL SOLO. Subir ese tope deja el nodo en BUCLE DE ARRANQUE, comprobado en banco:
; arrancan los builds que quedan por debajo (01 y 07) y fallan los que lo pasan (02/03/04/05/06).
; El espacio se saca de las BALIZAS DE MALLA (7.000 B medidas): es la palanca mas rentable que queda
; y NO toca nada de NavaTastic (ni comandos, ni resiliencia, ni radio). Decision del operador.
  -D MESHTASTIC_EXCLUDE_BEACON

[env:navarrico_faketec_sx1262_r2ig]
extends = env:nrf52_promicro_diy_tcxo
custom_meshtastic_app_env = nrf52_promicro_diy_tcxo
custom_meshtastic_prefs = profiles/R2IG_Faketec.jsonc
build_flags = ${env:nrf52_promicro_diy_tcxo.build_flags}
  -DNAVARICO_RADIO_SX1262
  -DNAVARICO_SOLO_SX126X
; Mismo motivo que en el Promicro: con el portaje completo se pasa del tope de 0xEC000.
  -D EXCLUDE_EMOJI
; NAVARICO-V6 (23/09): el motor /nava NO CABE por debajo del tope de fabrica (0xEA000 = 802.816 B):
; se pasa 912 B EL SOLO. Subir ese tope deja el nodo en BUCLE DE ARRANQUE, comprobado en banco:
; arrancan los builds que quedan por debajo (01 y 07) y fallan los que lo pasan (02/03/04/05/06).
; El espacio se saca de las BALIZAS DE MALLA (7.000 B medidas): es la palanca mas rentable que queda
; y NO toca nada de NavaTastic (ni comandos, ni resiliencia, ni radio). Decision del operador.
  -D MESHTASTIC_EXCLUDE_BEACON

; ---------------------------------------------------------------
; SEEED SOLAR NODE P1 - SX1262 pelado (22 dBm)
; ---------------------------------------------------------------

[env:navarrico_seed_sx1262_r2ig]
extends = env:seeed_solar_node
custom_meshtastic_app_env = seeed_solar_node
custom_meshtastic_prefs = profiles/R2IG_Seed.jsonc
build_flags = ${env:seeed_solar_node.build_flags}
  -DNAVARICO_RADIO_SX1262
; NAVARICO-V6 (24/09): el motor /nava no cabe en esta placa. Se excluyen las BALIZAS DE MALLA (7.000 B
; medidos). NO es una perdida para NavaTastic: el modulo de balizas NO EXISTE en V5.3 (es nuevo de 2.8
; upstream, ver _upstream_ref\src\modules\MeshBeaconModule.cpp) y NINGUNO de los 16 perfiles lo usa.
  -D MESHTASTIC_EXCLUDE_BEACON

; ---------------------------------------------------------------
; HELTEC T114 - SX1262 pelado (22 dBm). Es la placa con MENOS margen de flash y MAS RAM usada
; ---------------------------------------------------------------

[env:navarrico_t114_sx1262_r2ig]
extends = env:heltec-mesh-node-t114
custom_meshtastic_app_env = heltec-mesh-node-t114
custom_meshtastic_prefs = profiles/R2IG_T114.jsonc
build_flags = ${env:heltec-mesh-node-t114.build_flags}
  -DNAVARICO_RADIO_SX1262
; NAVARICO-V6 (24/09): la T114 es la placa con MENOS margen de flash de las 16. Se quitan los EMOJIS:
; es la palanca medida mas limpia y es puramente VISUAL (vacia la tabla de dibujos y el selector): no
; toca radio, paquetes, cifrado ni almacenamiento. Los mensajes con emoji siguen llegando y
; guardandose igual; solo dejan de dibujarse como imagen en pantalla.
; OJO: el filtro de NodeDB (favoritos/admin/routers, ver B-098) cuesta ~1.3 KB y la dejo al borde
; (802.592 de 802.816 = 224 B). Los emojis son el colchon.
  -D EXCLUDE_EMOJI
; NAVARICO-V6 (24/09): ademas hay que excluir las BALIZAS DE MALLA (7.000 B medidos). El modulo de
; balizas NO EXISTE en V5.3 (es nuevo de 2.8 upstream) y NINGUNO de los 16 perfiles lo usa, asi que
; no se pierde nada de NavaTastic. Nota: la decision del 13/09 de "conservar las balizas" se tomo
; cuando el problema era de 1.352 B en esta unica placa; hoy son 10 envs las que no enlazan.
  -D MESHTASTIC_EXCLUDE_BEACON

; ---------------------------------------------------------------
; SEEED XIAO nRF52840 KIT i2c - DOS envs porque son DOS modulos distintos pinchados en la MISMA
