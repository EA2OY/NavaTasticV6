extends = env:navarrico_seed_sx1262_r2ig
custom_meshtastic_propia_keys = true

[env:navarrico_t114_sx1262_r2ip]
extends = env:navarrico_t114_sx1262_r2ig
custom_meshtastic_propia_keys = true

[env:navarrico_xiao_kit_sx1262_r2ip]
extends = env:navarrico_xiao_kit_sx1262_r2ig
custom_meshtastic_propia_keys = true

[env:navarrico_xiao_e22p_r2ip]
extends = env:navarrico_xiao_e22p_r2ig
custom_meshtastic_propia_keys = true

[env:navarrico_promicro_e22p_r1ip]
extends = env:navarrico_promicro_e22p_r1ig
custom_meshtastic_propia_keys = true

[env:navarrico_faketec_sx1262_r1ip]
extends = env:navarrico_faketec_sx1262_r1ig
custom_meshtastic_propia_keys = true

[env:navarrico_seed_sx1262_r1ip]
extends = env:navarrico_seed_sx1262_r1ig
custom_meshtastic_propia_keys = true

[env:navarrico_t114_sx1262_r1ip]
extends = env:navarrico_t114_sx1262_r1ig
custom_meshtastic_propia_keys = true

[env:navarrico_xiao_kit_sx1262_r1ip]
extends = env:navarrico_xiao_kit_sx1262_r1ig
custom_meshtastic_propia_keys = true

[env:navarrico_xiao_e22p_r1ip]
extends = env:navarrico_xiao_e22p_r1ig
