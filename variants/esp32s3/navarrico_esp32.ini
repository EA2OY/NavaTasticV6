; =====================================================================
; NAVARICO V6 - ENVS ESP32 (Heltec V3 y V4) - Meshtastic 2.8.0 oficial
; =====================================================================
; OJO, DOS COSAS QUE NO SON COMO EN LAS nRF52:
;  1) Estos envs NO llevan -DNAVARICO_SOLO_SX126X: las placas ESP32 ya declaran una sola familia
;     de radio (USE_SX1262), asi que el flag no ahorraria nada.
;  2) SI llevan -DFIX_NATIVE_CORE_RESET. En el fork esa macro se define en ESTE .ini (no en los
;     variant.h, que es donde se define en las nRF52). Es la que hace que Channels.cpp aplique la
;     config de radio; sin ella, los Heltec saldrian en LONG_FAST y FUERA de la malla.
;     (Aprendido a golpes: buscar la macro donde se ESPERA encontrarla dio una alarma falsa.)
;
; El tope de flash de estas placas NO es 0xEA000: lo fija su tabla de particiones
; (default_8MB.csv en V3 -> 3.342.336 B de app; default_16MB.csv en V4 -> 6.553.600 B).
; Medido el 13/09: V3 usa 2.279.711 B (1,01 MB libres) y V4 2.298.359 B (4,06 MB libres).
;
; RECORDATORIO: compilar ESP32 exige ampliar el permiso del sandbox en esa invocacion (el toolchain
; de ESP-IDF descarga herramientas y hace git fetch en su configuracion) y compilar desde un enlace
; sin espacios (el toolchain RECHAZA rutas con espacios: "Detected a whitespace character").
; =====================================================================

; ---------------------------------------------------------------
; HELTEC V3 - SX1262 directo (~21-22 dBm). Perfil con TX_POWER 22
; ---------------------------------------------------------------

[env:navarrico_heltec_v3_sx1262_r2ig]
extends = env:heltec-v3
custom_meshtastic_app_env = heltec-v3
custom_meshtastic_prefs = profiles/R2IG_HeltecV3.jsonc
build_flags = ${env:heltec-v3.build_flags}
  -DFIX_NATIVE_CORE_RESET

[env:navarrico_heltec_v3_sx1262_r1ig]
extends = env:heltec-v3
custom_meshtastic_app_env = heltec-v3
custom_meshtastic_prefs = profiles/R1IG_HeltecV3.jsonc
build_flags = ${env:heltec-v3.build_flags}
  -DFIX_NATIVE_CORE_RESET
  -DNAVARICO_RAMA_1

; ---------------------------------------------------------------
; HELTEC V4 - SX1262 -> atenuador Pi -> FEM (GC1109 / KCT8103L). Perfil con TX_POWER 20:
; su amplificador SATURA, pedir mas no da mas potencia y solo gasta bateria.
; ---------------------------------------------------------------

[env:navarrico_heltec_v4_sx1262_r2ig]
extends = env:heltec-v4
custom_meshtastic_app_env = heltec-v4
custom_meshtastic_prefs = profiles/R2IG_HeltecV4.jsonc
build_flags = ${env:heltec-v4.build_flags}
  -DFIX_NATIVE_CORE_RESET

[env:navarrico_heltec_v4_sx1262_r1ig]
extends = env:heltec-v4
custom_meshtastic_app_env = heltec-v4
custom_meshtastic_prefs = profiles/R1IG_HeltecV4.jsonc
build_flags = ${env:heltec-v4.build_flags}
  -DFIX_NATIVE_CORE_RESET
  -DNAVARICO_RAMA_1

; ---------------------------------------------------------------
; INFRAESTRUCTURA PROPIA (ESP32) - sin perfil en el repo: claves por variables de entorno
; ---------------------------------------------------------------

[env:navarrico_heltec_v4_sx1262_r2ip]
extends = env:navarrico_heltec_v4_sx1262_r2ig
custom_meshtastic_propia_keys = true
